<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Featured 3D Ludo King</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
        }

        /* Mode Selection Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            border: 2px solid #3b82f6;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-card h2 { color: #f59e0b; margin-bottom: 15px; }
        .mode-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: none;
            padding: 12px 20px;
            margin: 6px 0;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }
        .mode-btn:hover { transform: translateY(-2deg); }

        .game-card { max-width: 450px; width: 100%; text-align: center; }

        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
            font-size: 11px;
        }
        .stat-item {
            background: #1e293b;
            padding: 6px 2px;
            border-radius: 6px;
            font-weight: bold;
        }
        .s-red { border-bottom: 4px solid #ef4444; }
        .s-green { border-bottom: 4px solid #22c55e; }
        .s-yellow { border-bottom: 4px solid #eab308; }
        .s-blue { border-bottom: 4px solid #3b82f6; }

        /* Ludo Board Grid */
        #ludo-board {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            background: #ffffff;
            border-radius: 8px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 4px solid #334155;
            position: relative;
        }

        .cell {
            border: 0.5px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #fff;
            font-size: 12px;
        }

        /* Yards & Special Paths */
        .yard-red { background: #ef4444 !important; }
        .yard-green { background: #22c55e !important; }
        .yard-yellow { background: #eab308 !important; }
        .yard-blue { background: #3b82f6 !important; }
        .center-home { background: conic-gradient(#ef4444 0 90deg, #22c55e 90deg 180deg, #3b82f6 180deg 270deg, #eab308 270deg 360deg) !important; }

        .hr-red { background: #fca5a5 !important; }
        .hr-green { background: #86efac !important; }
        .hr-yellow { background: #fef08a !important; }
        .hr-blue { background: #93c5fd !important; }

        .safe-star::after {
            content: '⭐';
            font-size: 14px;
            position: absolute;
            z-index: 1;
            opacity: 0.7;
        }

        /* Token / Goti Styling */
        .token {
            width: 75%;
            height: 75%;
            border-radius: 50%;
            border: 2px solid #fff;
            position: absolute;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .token-RED { background: radial-gradient(circle at 30% 30%, #f87171, #b91c1c); }
        .token-GREEN { background: radial-gradient(circle at 30% 30%, #4ade80, #15803d); }
        .token-YELLOW { background: radial-gradient(circle at 30% 30%, #facc15, #a16207); }
        .token-BLUE { background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8); }

        /* Highlight Clickable Tokens */
        .token-active {
            animation: bounce 0.6s infinite alternate;
            border: 2px solid #f59e0b !important;
            box-shadow: 0 0 10px #f59e0b;
        }

        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.25); }
        }

        /* Controls */
        .controls {
            margin-top: 12px;
            background: #1e293b;
            padding: 12px;
            border-radius: 12px;
        }

        .dice-box {
            font-size: 32px;
            font-weight: bold;
            width: 55px;
            height: 55px;
            line-height: 55px;
            background: #0f172a;
            color: #f59e0b;
            margin: 8px auto;
            border-radius: 8px;
            border: 2px solid #334155;
        }

        .roll-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
        }
        .roll-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .status { font-size: 13px; color: #cbd5e1; margin-top: 6px; }
    </style>
</head>
<body>

<div class="modal-overlay" id="start-modal">
    <div class="modal-card">
        <h2>🎮 Select Players</h2>
        <button class="mode-btn" onclick="startGame(2)">2 Players (Red vs Yellow)</button>
        <button class="mode-btn" onclick="startGame(3)">3 Players (Red, Green, Yellow)</button>
        <button class="mode-btn" onclick="startGame(4)">4 Players (All Colors)</button>
    </div>
</div>

<div class="game-card">
    <h3 style="color:#f59e0b; margin-bottom: 8px;">Ludo King Clone</h3>

    <div class="stats-bar">
        <div class="stat-item s-red" id="box-red">Red 6s: <span id="six-red">0</span>/8</div>
        <div class="stat-item s-green" id="box-green">Green 6s: <span id="six-green">0</span>/8</div>
        <div class="stat-item s-yellow" id="box-yellow">Yellow 6s: <span id="six-yellow">0</span>/8</div>
        <div class="stat-item s-blue" id="box-blue">Blue 6s: <span id="six-blue">0</span>/8</div>
    </div>

    <div id="ludo-board"></div>

    <div class="controls">
        <div>Current Turn: <b id="turn-txt" style="color:#ef4444;">RED</b></div>
        <div class="dice-box" id="dice-box">-</div>
        <button class="roll-btn" id="roll-btn" onclick="rollTurn()">🎲 Roll Dice</button>
        <div class="status" id="status-msg">Roll dice to start game!</div>
    </div>
</div>

<script>
    // Audio Synthesizer
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
    function playSound(freq, duration) {
        initAudio();
        if (!audioCtx) return;
        let osc = audioCtx.createOscillator();
        let gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
    }

    // Board Map & Track Loops
    const boardEl = document.getElementById('ludo-board');
    const cells = {};
    
    // 52 Common Outer Track Cells Coordinates (r_c)
    const trackCoords = [
        '14_7', '13_7', '12_7', '11_7', '10_7', '9_6', '9_5', '9_4', '9_3', '9_2', '9_1',
        '8_1', '7_1', '7_2', '7_3', '7_4', '7_5', '7_6', '6_7', '5_7', '4_7', '3_7', '2_7', '1_7',
        '1_8', '1_9', '2_9', '3_9', '4_9', '5_9', '6_9', '7_10', '7_11', '7_12', '7_13', '7_14', '7_15',
        '8_15', '9_15', '9_14', '9_13', '9_12', '9_11', '9_10', '10_9', '11_9', '12_9', '13_9', '14_9', '15_9',
        '15_8', '15_7'
    ];

    // Home paths for each color
    const homePaths = {
        RED: ['14_8', '13_8', '12_8', '11_8', '10_8', '9_8'],
        GREEN: ['8_2', '8_3', '8_4', '8_5', '8_6', '8_7'],
        YELLOW: ['2_8', '3_8', '4_8', '5_8', '6_8', '7_8'],
        BLUE: ['8_14', '8_13', '8_12', '8_11', '8_10', '8_9']
    };

    const startOffsets = { RED: 0, GREEN: 13, YELLOW: 26, BLUE: 39 };
    const safeCellIndices = [0, 8, 13, 21, 26, 34, 39, 47]; // Safe Star Locations

    // Fixed Yard Spot Coordinates for 4 Gotiyan each
    const yardSpots = {
        RED: ['2_2', '2_5', '5_2', '5_5'],
        GREEN: ['2_11', '2_14', '5_11', '5_14'],
        YELLOW: ['11_2', '11_5', '14_2', '14_5'],
        BLUE: ['11_11', '11_14', '14_11', '14_14']
    };

    let activePlayers = ['RED', 'GREEN', 'YELLOW', 'BLUE'];
    const colors = { RED: '#ef4444', GREEN: '#22c55e', YELLOW: '#eab308', BLUE: '#3b82f6' };
    let turnIdx = 0;
    let currentDice = 0;
    let awaitTokenClick = false;

    const sixCount = { RED: 0, GREEN: 0, YELLOW: 0, BLUE: 0 };
    // Token Positions: -1 = Yard, 0..50 = Main Track, 51..56 = Home Path, 57 = Finished
    const tokens = {
        RED: [-1, -1, -1, -1],
        GREEN: [-1, -1, -1, -1],
        YELLOW: [-1, -1, -1, -1],
        BLUE: [-1, -1, -1, -1]
    };

    function startGame(count) {
        if (count === 2) activePlayers = ['RED', 'YELLOW'];
        else if (count === 3) activePlayers = ['RED', 'GREEN', 'YELLOW'];
        else activePlayers = ['RED', 'GREEN', 'YELLOW', 'BLUE'];

        ['RED', 'GREEN', 'YELLOW', 'BLUE'].forEach(p => {
            document.getElementById(`box-${p.toLowerCase()}`).style.opacity = activePlayers.includes(p) ? '1' : '0.2';
        });

        document.getElementById('start-modal').style.display = 'none';
        buildBoard();
        renderTokens();
    }

    function buildBoard() {
        boardEl.innerHTML = '';
        for (let r = 1; r <= 15; r++) {
            for (let c = 1; c <= 15; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const key = `${r}_${c}`;

                if (r <= 6 && c <= 6) cell.classList.add('yard-red');
                else if (r <= 6 && c >= 10) cell.classList.add('yard-green');
                else if (r >= 10 && c <= 6) cell.classList.add('yard-yellow');
                else if (r >= 10 && c >= 10) cell.classList.add('yard-blue');
                else if (r >= 7 && r <= 9 && c >= 7 && c <= 9) cell.classList.add('center-home');

                if (r === 8 && c >= 2 && c <= 6) cell.classList.add('hr-green');
                if (c === 8 && r >= 2 && r <= 6) cell.classList.add('hr-yellow');
                if (r === 8 && c >= 10 && c <= 14) cell.classList.add('hr-blue');
                if (c === 8 && r >= 10 && r <= 14) cell.classList.add('hr-red');

                // Mark Safe Star cells
                let trackIdx = trackCoords.indexOf(key);
                if (trackIdx !== -1 && safeCellIndices.includes(trackIdx)) {
                    cell.classList.add('safe-star');
                }

                boardEl.appendChild(cell);
                cells[key] = cell;
            }
        }
    }

    function getCellKey(player, posIdx, tIndex) {
        if (posIdx === -1) return yardSpots[player][tIndex];
        if (posIdx >= 0 && posIdx <= 50) {
            let absIdx = (startOffsets[player] + posIdx) % 52;
            return trackCoords[absIdx];
        }
        if (posIdx >= 51 && posIdx <= 56) {
            return homePaths[player][posIdx - 51];
        }
        return '8_8'; // Center Home
    }

    function renderTokens() {
        document.querySelectorAll('.token').forEach(t => t.remove());

        activePlayers.forEach(p => {
            tokens[p].forEach((pos, idx) => {
                let cellKey = getCellKey(p, pos, idx);
                if (cells[cellKey]) {
                    let t = document.createElement('div');
                    t.className = `token token-${p}`;
                    t.dataset.player = p;
                    t.dataset.tokenIdx = idx;

                    // Add highlight if active turn and movable
                    if (awaitTokenClick && p === activePlayers[turnIdx] && canMoveToken(p, idx, currentDice)) {
                        t.classList.add('token-active');
                        t.onclick = () => onTokenClick(p, idx);
                    }

                    cells[cellKey].appendChild(t);
                }
            });
        });
    }

    function canMoveToken(player, tIdx, dice) {
        let pos = tokens[player][tIdx];
        if (pos === -1) return dice === 6; // Lock opens only on 6
        if (pos + dice <= 57) return true;
        return false;
    }

    function rollTurn() {
        if (awaitTokenClick) return;

        const p = activePlayers[turnIdx];
        playSound(300, 0.1);

        // Custom 8-Six Limit Rule
        if (sixCount[p] >= 8) {
            currentDice = Math.floor(Math.random() * 5) + 1;
        } else {
            currentDice = Math.floor(Math.random() * 6) + 1;
            if (currentDice === 6) sixCount[p]++;
        }

        document.getElementById('dice-box').innerText = currentDice;
        document.getElementById(`six-${p.toLowerCase()}`).innerText = sixCount[p];

        // Check movable tokens
        let movable = tokens[p].some((_, idx) => canMoveToken(p, idx, currentDice));

        if (!movable) {
            document.getElementById('status-msg').innerText = `${p} rolled ${currentDice}. No valid move!`;
            setTimeout(nextTurn, 1000);
        } else {
            awaitTokenClick = true;
            document.getElementById('status-msg').innerText = `${p} rolled ${currentDice}. Tap a goti to move!`;
            document.getElementById('roll-btn').disabled = true;
            renderTokens();
        }
    }

    function onTokenClick(player, tIdx) {
        if (!awaitTokenClick) return;

        let currentPos = tokens[player][tIdx];
        
        if (currentPos === -1 && currentDice === 6) {
            tokens[player][tIdx] = 0; // Move out to start cell
            playSound(600, 0.15);
        } else if (currentPos >= 0) {
            tokens[player][tIdx] += currentDice;
            playSound(450, 0.1);
        }

        let newPos = tokens[player][tIdx];

        // Cutting / Kill Logic Check
        let cutOccurred = false;
        if (newPos >= 0 && newPos <= 50) {
            let landingCell = getCellKey(player, newPos, tIdx);
            let absIdx = trackCoords.indexOf(landingCell);

            // Cut only if NOT on Safe Star Cell
            if (!safeCellIndices.includes(absIdx)) {
                activePlayers.forEach(opp => {
                    if (opp !== player) {
                        tokens[opp].forEach((oppPos, oppTIdx) => {
                            if (oppPos >= 0 && oppPos <= 50) {
                                if (getCellKey(opp, oppPos, oppTIdx) === landingCell) {
                                    tokens[opp][oppTIdx] = -1; // Send opponent back to yard!
                                    cutOccurred = true;
                                    playSound(150, 0.3);
                                    document.getElementById('status-msg').innerText = `💥 ${player} cut ${opp}'s goti! Extra Turn!`;
                                }
                            }
                        });
                    }
                });
            }
        }

        awaitTokenClick = false;
        document.getElementById('roll-btn').disabled = false;
        renderTokens();

        // Extra turn on 6 or Goti Cut
        if (currentDice === 6 || cutOccurred) {
            document.getElementById('status-msg').innerText += " Roll again!";
        } else {
            nextTurn();
        }
    }

    function nextTurn() {
        turnIdx = (turnIdx + 1) % activePlayers.length;
        const nextP = activePlayers[turnIdx];
        const turnTxt = document.getElementById('turn-txt');
        turnTxt.innerText = nextP;
        turnTxt.style.color = colors[nextP];
        document.getElementById('status-msg').innerText = `Turn: ${nextP}`;
    }
</script>

</body>
</html>
