<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real Ludo King UI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0284c7;
            background-image: radial-gradient(#0369a1 2px, transparent 2px);
            background-size: 16px 16px;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            overflow: hidden;
        }

        /* Player Mode Selection Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }
        .modal-card {
            background: #0f172a;
            padding: 24px;
            border-radius: 16px;
            text-align: center;
            max-width: 320px;
            width: 90%;
            border: 3px solid #f59e0b;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-card h2 { color: #f59e0b; margin-bottom: 15px; font-size: 20px; }
        .mode-btn {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            border: 2px solid #60a5fa;
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        /* Header Player Cards */
        .top-bar {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .p-card {
            background: rgba(15, 23, 42, 0.8);
            border: 2px solid #38bdf8;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Ludo Board */
        .board-container {
            width: 100%;
            max-width: 420px;
            aspect-ratio: 1;
            background: #fff;
            border-radius: 12px;
            border: 5px solid #1e293b;
            box-shadow: 0 12px 25px rgba(0,0,0,0.5);
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            position: relative;
        }

        .cell {
            border: 0.5px solid #cbd5e1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        /* Color Sections */
        .yard-green { background: #16a34a !important; }
        .yard-yellow { background: #eab308 !important; }
        .yard-red { background: #dc2626 !important; }
        .yard-blue { background: #2563eb !important; }

        .yard-box {
            position: absolute;
            width: 70%;
            height: 70%;
            background: #fff;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 8px;
            gap: 8px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.3);
        }
        .yard-spot {
            background: #f1f5f9;
            border-radius: 50%;
            border: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .center-home {
            background: conic-gradient(#16a34a 0 90deg, #eab308 90deg 180deg, #2563eb 180deg 270deg, #dc2626 270deg 360deg) !important;
        }

        .path-red { background: #fca5a5 !important; }
        .path-green { background: #86efac !important; }
        .path-yellow { background: #fef08a !important; }
        .path-blue { background: #93c5fd !important; }

        /* Symbols & Arrows */
        .star-icon::after { content: '☆'; font-size: 18px; color: #475569; font-weight: bold; }
        .arrow-up::after { content: '↑'; font-size: 16px; color: #dc2626; font-weight: bold; }
        .arrow-right::after { content: '→'; font-size: 16px; color: #16a34a; font-weight: bold; }
        .arrow-down::after { content: '↓'; font-size: 16px; color: #eab308; font-weight: bold; }
        .arrow-left::after { content: '←'; font-size: 16px; color: #2563eb; font-weight: bold; }

        /* SVG Pin Gotiyan (Exact Image Look) */
        .goti-pin {
            width: 22px;
            height: 28px;
            position: absolute;
            z-index: 20;
            cursor: pointer;
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.5));
            transition: transform 0.15s ease, top 0.2s, left 0.2s;
        }
        
        .goti-active {
            animation: bouncePin 0.5s infinite alternate;
            z-index: 30;
        }

        @keyframes bouncePin {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-8px) scale(1.15); }
        }

        /* Bottom Controls Bar (Image Style) */
        .bottom-bar {
            width: 100%;
            max-width: 420px;
            background: rgba(15, 23, 42, 0.9);
            border-radius: 12px;
            padding: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid #38bdf8;
            margin-top: 10px;
        }

        .player-turn-box {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 14px;
        }

        .dice-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .dice-btn {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            font-weight: bold;
            color: #0f172a;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 3px solid #cbd5e1;
            cursor: pointer;
        }

        .roll-btn-main {
            background: linear-gradient(135deg, #eab308, #ca8a04);
            border: none;
            color: #0f172a;
            font-weight: bold;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .roll-btn-main:disabled { opacity: 0.5; }
    </style>
</head>
<body>

<!-- Player Select Modal -->
<div class="modal-overlay" id="start-modal">
    <div class="modal-card">
        <h2>🎮 Choose Players Mode</h2>
        <button class="mode-btn" onclick="startGame(2)">2 Players (Red vs Yellow)</button>
        <button class="mode-btn" onclick="startGame(3)">3 Players (Red, Green, Yellow)</button>
        <button class="mode-btn" onclick="startGame(4)">4 Players (All Colors)</button>
    </div>
</div>

<div class="top-bar">
    <div class="p-card" id="card-red">🔴 Red: <span id="six-RED">0</span>/8</div>
    <div class="p-card" id="card-yellow">🟡 Yellow: <span id="six-YELLOW">0</span>/8</div>
</div>

<div class="board-container" id="board"></div>

<div class="bottom-bar">
    <div class="player-turn-box">
        <span id="turn-indicator-dot" style="font-size: 20px;">🔴</span>
        <span id="turn-text" style="color:#f87171;">RED'S TURN</span>
    </div>
    <div class="dice-container">
        <div class="dice-btn" id="dice-display">🎲</div>
        <button class="roll-btn-main" id="roll-btn" onclick="rollDice()">ROLL</button>
    </div>
</div>

<script>
    // Pin Goti SVG Generator
    function createPinSVG(colorHex) {
        return `
        <svg viewBox="0 0 32 42" width="100%" height="100%">
            <path d="M16 0 C7.16 0 0 7.16 0 16 C0 28 16 42 16 42 C16 42 32 28 32 16 C32 7.16 24.84 0 16 0 Z" fill="#ffffff" stroke="#334155" stroke-width="2"/>
            <circle cx="16" cy="15" r="9" fill="${colorHex}"/>
            <circle cx="13" cy="12" r="3" fill="#ffffff" opacity="0.6"/>
        </svg>`;
    }

    const colorHexes = { RED: '#dc2626', GREEN: '#16a34a', YELLOW: '#eab308', BLUE: '#2563eb' };
    
    // 52 Step Track (Grid r_c)
    const trackCoords = [
        '14_7', '13_7', '12_7', '11_7', '10_7', '9_6', '9_5', '9_4', '9_3', '9_2', '9_1',
        '8_1', '7_1', '7_2', '7_3', '7_4', '7_5', '7_6', '6_7', '5_7', '4_7', '3_7', '2_7', '1_7',
        '1_8', '1_9', '2_9', '3_9', '4_9', '5_9', '6_9', '7_10', '7_11', '7_12', '7_13', '7_14', '7_15',
        '8_15', '9_15', '9_14', '9_13', '9_12', '9_11', '9_10', '10_9', '11_9', '12_9', '13_9', '14_9', '15_9',
        '15_8', '15_7'
    ];

    const homePaths = {
        RED: ['14_8', '13_8', '12_8', '11_8', '10_8', '9_8'],
        GREEN: ['8_2', '8_3', '8_4', '8_5', '8_6', '8_7'],
        YELLOW: ['2_8', '3_8', '4_8', '5_8', '6_8', '7_8'],
        BLUE: ['8_14', '8_13', '8_12', '8_11', '8_10', '8_9']
    };

    const startOffsets = { RED: 0, GREEN: 13, YELLOW: 26, BLUE: 39 };
    const safeIndices = [0, 8, 13, 21, 26, 34, 39, 47]; // Safe stars

    const yardSpotCoords = {
        RED: ['12_2', '12_4', '14_2', '14_4'],
        GREEN: ['2_2', '2_4', '4_2', '4_4'],
        YELLOW: ['2_12', '2_14', '4_12', '4_14'],
        BLUE: ['12_12', '12_14', '14_12', '14_14']
    };

    let activePlayers = ['RED', 'YELLOW'];
    let turnIdx = 0;
    let diceVal = 0;
    let awaitingMove = false;
    const sixCounts = { RED: 0, GREEN: 0, YELLOW: 0, BLUE: 0 };

    // -1 = In Yard, 0-50 = Track, 51-56 = Home Stretch
    const tokens = {
        RED: [-1, -1, -1, -1],
        GREEN: [-1, -1, -1, -1],
        YELLOW: [-1, -1, -1, -1],
        BLUE: [-1, -1, -1, -1]
    };

    const boardEl = document.getElementById('board');
    const cells = {};

    function startGame(num) {
        if (num === 2) activePlayers = ['RED', 'YELLOW'];
        else if (num === 3) activePlayers = ['RED', 'GREEN', 'YELLOW'];
        else activePlayers = ['RED', 'GREEN', 'YELLOW', 'BLUE'];

        document.getElementById('start-modal').style.display = 'none';
        buildBoard();
        renderTokens();
        updateTurnUI();
    }

    function buildBoard() {
        boardEl.innerHTML = '';
        for (let r = 1; r <= 15; r++) {
            for (let c = 1; c <= 15; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                const key = `${r}_${c}`;

                // Color Yards
                if (r <= 6 && c <= 6) cell.classList.add('yard-green');
                else if (r <= 6 && c >= 10) cell.classList.add('yard-yellow');
                else if (r >= 10 && c <= 6) cell.classList.add('yard-red');
                else if (r >= 10 && c >= 10) cell.classList.add('yard-blue');
                else if (r >= 7 && r <= 9 && c >= 7 && c <= 9) cell.classList.add('center-home');

                // Paths
                if (r === 8 && c >= 2 && c <= 6) cell.classList.add('path-green');
                if (c === 8 && r >= 2 && r <= 6) cell.classList.add('path-yellow');
                if (r === 8 && c >= 10 && c <= 14) cell.classList.add('path-blue');
                if (c === 8 && r >= 10 && r <= 14) cell.classList.add('path-red');

                // Special Symbols
                if (key === '14_7') cell.classList.add('arrow-up');
                if (key === '7_2') cell.classList.add('arrow-right');
                if (key === '2_9') cell.classList.add('arrow-down');
                if (key === '9_14') cell.classList.add('arrow-left');

                let trackIdx = trackCoords.indexOf(key);
                if (trackIdx !== -1 && safeIndices.includes(trackIdx)) {
                    cell.classList.add('star-icon');
                }

                boardEl.appendChild(cell);
                cells[key] = cell;
            }
        }
    }

    function getCellKey(player, posIdx, tIdx) {
        if (posIdx === -1) return yardSpotCoords[player][tIdx];
        if (posIdx >= 0 && posIdx <= 50) {
            let absIdx = (startOffsets[player] + posIdx) % 52;
            return trackCoords[absIdx];
        }
        if (posIdx >= 51 && posIdx <= 56) {
            return homePaths[player][posIdx - 51];
        }
        return '8_8';
    }

    function renderTokens() {
        document.querySelectorAll('.goti-pin').forEach(el => el.remove());

        activePlayers.forEach(p => {
            tokens[p].forEach((pos, idx) => {
                let key = getCellKey(p, pos, idx);
                if (cells[key]) {
                    let pin = document.createElement('div');
                    pin.className = `goti-pin`;
                    pin.innerHTML = createPinSVG(colorHexes[p]);

                    if (awaitingMove && p === activePlayers[turnIdx] && canMove(p, idx, diceVal)) {
                        pin.classList.add('goti-active');
                        pin.onclick = () => moveToken(p, idx);
                    }

                    cells[key].appendChild(pin);
                }
            });
        });
    }

    function canMove(player, tIdx, val) {
        let p = tokens[player][tIdx];
        if (p === -1) return val === 6; // Lock opens only on 6
        if (p + val <= 56) return true;
        return false;
    }

    function rollDice() {
        if (awaitingMove) return;

        const p = activePlayers[turnIdx];
        const btn = document.getElementById('roll-btn');
        btn.disabled = true;

        // Roll logic with 8-Six Limit
        if (sixCounts[p] >= 8) {
            diceVal = Math.floor(Math.random() * 5) + 1;
        } else {
            diceVal = Math.floor(Math.random() * 6) + 1;
            if (diceVal === 6) sixCounts[p]++;
        }

        document.getElementById('dice-display').innerText = diceVal;
        if (document.getElementById(`six-${p}`)) {
            document.getElementById(`six-${p}`).innerText = sixCounts[p];
        }

        let hasValidMove = tokens[p].some((_, i) => canMove(p, i, diceVal));

        if (!hasValidMove) {
            setTimeout(nextTurn, 800);
        } else {
            awaitingMove = true;
            renderTokens();
        }
    }

    function moveToken(player, tIdx) {
        if (!awaitingMove) return;

        let curPos = tokens[player][tIdx];

        if (curPos === -1 && diceVal === 6) {
            tokens[player][tIdx] = 0; // Move out to start
        } else if (curPos >= 0) {
            tokens[player][tIdx] += diceVal;
        }

        let newPos = tokens[player][tIdx];

        // Cutting / Kill Opponent Goti
        let hasCut = false;
        if (newPos >= 0 && newPos <= 50) {
            let landKey = getCellKey(player, newPos, tIdx);
            let absIdx = trackCoords.indexOf(landKey);

            if (!safeIndices.includes(absIdx)) {
                activePlayers.forEach(opp => {
                    if (opp !== player) {
                        tokens[opp].forEach((oppPos, oppTIdx) => {
                            if (oppPos >= 0 && oppPos <= 50) {
                                if (getCellKey(opp, oppPos, oppTIdx) === landKey) {
                                    tokens[opp][oppTIdx] = -1; // Send back to yard!
                                    hasCut = true;
                                }
                            }
                        });
                    }
                });
            }
        }

        awaitingMove = false;
        document.getElementById('roll-btn').disabled = false;
        renderTokens();

        if (diceVal === 6 || hasCut) {
            // Extra Turn on 6 or Cut
            document.getElementById('roll-btn').disabled = false;
        } else {
            nextTurn();
        }
    }

    function nextTurn() {
        turnIdx = (turnIdx + 1) % activePlayers.length;
        updateTurnUI();
        document.getElementById('roll-btn').disabled = false;
        document.getElementById('dice-display').innerText = '🎲';
    }

    function updateTurnUI() {
        const p = activePlayers[turnIdx];
        const dots = { RED: '🔴', GREEN: '🟢', YELLOW: '🟡', BLUE: '🔵' };
        document.getElementById('turn-indicator-dot').innerText = dots[p];
        document.getElementById('turn-text').innerText = `${p}'S TURN`;
        document.getElementById('turn-text').style.color = colorHexes[p];
    }
</script>

</body>
</html>
