<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Ludo Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 10px;
        }

        .container {
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        h2 { color: #f1c40f; margin-bottom: 10px; font-size: 20px; }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
            font-size: 12px;
        }

        .stat-card {
            background: #1f2937;
            padding: 8px;
            border-radius: 6px;
            border-left: 4px solid #fff;
        }

        .card-red { border-color: #ef4444; }
        .card-green { border-color: #22c55e; }
        .card-yellow { border-color: #eab308; }
        .card-blue { border-color: #3b82f6; }

        /* Ludo Board Layout */
        .ludo-board {
            width: 100%;
            aspect-ratio: 1;
            display: grid;
            grid-template-columns: repeat(15, 1fr);
            grid-template-rows: repeat(15, 1fr);
            background: #ffffff;
            border: 4px solid #374151;
            border-radius: 8px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        /* Color Yards */
        .yard {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12%;
        }
        .yard-red { grid-area: 1 / 1 / 7 / 7; background: #ef4444; }
        .yard-green { grid-area: 1 / 10 / 7 / 16; background: #22c55e; }
        .yard-yellow { grid-area: 10 / 1 / 16 / 7; background: #eab308; }
        .yard-blue { grid-area: 10 / 10 / 16 / 16; background: #3b82f6; }

        .yard-box {
            background: #fff;
            width: 100%;
            height: 100%;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            padding: 15%;
            gap: 15%;
        }

        .spot { border-radius: 50%; opacity: 0.8; }
        .spot-red { background: #ef4444; }
        .spot-green { background: #22c55e; }
        .spot-yellow { background: #eab308; }
        .spot-blue { background: #3b82f6; }

        /* Center Home Triangle */
        .center-home {
            grid-area: 7 / 7 / 10 / 10;
            background: conic-gradient(#ef4444 0 90deg, #22c55e 90deg 180deg, #3b82f6 180deg 270deg, #eab308 270deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: bold;
            color: #fff;
        }

        /* Paths & Home Run Cells */
        .cell {
            border: 0.5px solid #d1d5db;
            background: #fff;
        }
        .path-red { background: #fca5a5 !important; }
        .path-green { background: #86efac !important; }
        .path-yellow { background: #fef08a !important; }
        .path-blue { background: #93c5fd !important; }

        /* Controls Area */
        .controls {
            margin-top: 12px;
            background: #1f2937;
            padding: 12px;
            border-radius: 8px;
        }

        .dice-display {
            font-size: 32px;
            font-weight: bold;
            width: 55px;
            height: 55px;
            line-height: 55px;
            background: #374151;
            margin: 8px auto;
            border-radius: 8px;
            color: #f1c40f;
            border: 2px solid #4b5563;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
        }

        button:hover { background: #1d4ed8; }

        .status-text {
            font-size: 12px;
            margin-top: 6px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Ludo King Clone (8-Six Limit)</h2>

    <!-- Stats for 4 Players -->
    <div class="stats-grid">
        <div class="stat-card card-red">Red 6s: <b id="six-red">0</b>/8</div>
        <div class="stat-card card-green">Green 6s: <b id="six-green">0</b>/8</div>
        <div class="stat-card card-yellow">Yellow 6s: <b id="six-yellow">0</b>/8</div>
        <div class="stat-card card-blue">Blue 6s: <b id="six-blue">0</b>/8</div>
    </div>

    <!-- 15x15 Ludo Board -->
    <div class="ludo-board">
        <!-- Red Yard -->
        <div class="yard yard-red">
            <div class="yard-box">
                <div class="spot spot-red"></div>
                <div class="spot spot-red"></div>
                <div class="spot spot-red"></div>
                <div class="spot spot-red"></div>
            </div>
        </div>

        <!-- Green Yard -->
        <div class="yard yard-green">
            <div class="yard-box">
                <div class="spot spot-green"></div>
                <div class="spot spot-green"></div>
                <div class="spot spot-green"></div>
                <div class="spot spot-green"></div>
            </div>
        </div>

        <!-- Center Home -->
        <div class="center-home">HOME</div>

        <!-- Yellow Yard -->
        <div class="yard yard-yellow">
            <div class="yard-box">
                <div class="spot spot-yellow"></div>
                <div class="spot spot-yellow"></div>
                <div class="spot spot-yellow"></div>
                <div class="spot spot-yellow"></div>
            </div>
        </div>

        <!-- Blue Yard -->
        <div class="yard yard-blue">
            <div class="yard-box">
                <div class="spot spot-blue"></div>
                <div class="spot spot-blue"></div>
                <div class="spot spot-blue"></div>
                <div class="spot spot-blue"></div>
            </div>
        </div>
    </div>

    <!-- Dice & Turn Controls -->
    <div class="controls">
        <div>Current Turn: <b id="turn-name" style="color:#ef4444;">RED</b></div>
        <div class="dice-display" id="dice-value">-</div>
        <button id="roll-btn" onclick="playTurn()">Roll Dice</button>
        <div class="status-text" id="status-log">Game ready! Tap Roll Dice.</div>
    </div>
</div>

<script>
    const players = [
        { name: 'RED', color: '#ef4444' },
        { name: 'GREEN', color: '#22c55e' },
        { name: 'YELLOW', color: '#eab308' },
        { name: 'BLUE', color: '#3b82f6' }
    ];

    let currentTurnIndex = 0;
    const sixCounts = { RED: 0, GREEN: 0, YELLOW: 0, BLUE: 0 };
    const MAX_SIX = 8;

    // Custom Dice Logic
    function rollDice(player) {
        let dice;
        if (sixCounts[player] >= MAX_SIX) {
            // Strictly 1 to 5 only
            dice = Math.floor(Math.random() * 5) + 1;
        } else {
            // Normal 1 to 6
            dice = Math.floor(Math.random() * 6) + 1;
            if (dice === 6) {
                sixCounts[player]++;
            }
        }
        return dice;
    }

    function playTurn() {
        const player = players[currentTurnIndex].name;
        const roll = rollDice(player);

        document.getElementById('dice-value').innerText = roll;
        document.getElementById(`six-${player.toLowerCase()}`).innerText = sixCounts[player];

        let msg = `${player} rolled ${roll}.`;
        if (roll === 6 && sixCounts[player] >= MAX_SIX) {
            msg += " (6 limit (8) exhausted!)";
        }
        document.getElementById('status-log').innerText = msg;

        // Pass turn to next player
        currentTurnIndex = (currentTurnIndex + 1) % players.length;
        const nextPlayer = players[currentTurnIndex];
        
        const turnEl = document.getElementById('turn-name');
        turnEl.innerText = nextPlayer.name;
        turnEl.style.color = nextPlayer.color;
    }
</script>

</body>
</html>
